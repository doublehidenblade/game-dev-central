<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f4f0e5" stroke="#f4f0e5" stroke-width="0"/><text x="48" y="50" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#606b70" text-anchor="start">GARAGE MVP / INTERFACE PROPOSAL</text><text x="48" y="99" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#28343a" text-anchor="start">Utility rack / one removable fitting</text><text x="48" y="138" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#606b70" text-anchor="start">Open skeletal frame; preserve the cab-back window, bed visibility, lamps and tailgate access</text><rect x="1260" y="30" width="292" height="48" rx="6" fill="#f1dec1" stroke="#aa6324" stroke-width="1.5"/><text x="1406" y="61" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#aa6324" text-anchor="middle">DRAFT - NOT ACCEPTED</text><line x1="48" y1="158" x2="1552" y2="158" stroke="#bfc5c1" stroke-width="2"/><text x="48" y="1060" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#606b70" text-anchor="start">D = chosen design target   |   M = measured current-game fact   |   U = unresolved</text><text x="48" y="1090" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#606b70" text-anchor="start">2D schematic only. Not recovered r3 art, CAD, an engine capture or a runtime acceptance.</text><text x="1546" y="1085" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="500" fill="#606b70" text-anchor="end">02 / 06</text><rect x="48" y="184" width="920" height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="72" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">D: SEPARATE VIEWS OF THE SAME PROPOSED RACK</text><rect x="994" y="184" width="558" height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="1018" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">FIT AND CAPABILITY CONTRACT</text><text x="110" y="290" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#606b70" text-anchor="start">REAR ELEVATION</text><rect x="180" y="340" width="360" height="12" rx="0" fill="#78878b" stroke="#28343a" stroke-width="2"/><rect x="204" y="340" width="12" height="360" rx="0" fill="#78878b" stroke="#28343a" stroke-width="2"/><rect x="504" y="340" width="12" height="360" rx="0" fill="#78878b" stroke="#28343a" stroke-width="2"/><rect x="195" y="685" width="30" height="15" rx="0" fill="#aa6324" stroke="#28343a" stroke-width="2"/><rect x="495" y="685" width="30" height="15" rx="0" fill="#aa6324" stroke="#28343a" stroke-width="2"/><line x1="155" y1="700" x2="566" y2="700" stroke="#28343a" stroke-width="4"/><text x="170" y="735" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#aa6324" text-anchor="start">BED FLOOR / +0.72 m</text><rect x="248" y="410" width="224" height="236" rx="0" fill="#d9e9e8" stroke="#236675" stroke-width="1" stroke-dasharray="6 5"/><text x="360" y="495" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" fill="#236675" text-anchor="middle">OPEN</text><text x="360" y="530" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#236675" text-anchor="middle">NEGATIVE SPACE</text><line x1="180" y1="320" x2="540" y2="320" stroke="#aa6324" stroke-width="2"/><line x1="180" y1="313" x2="180" y2="327" stroke="#aa6324" stroke-width="2"/><line x1="540" y1="313" x2="540" y2="327" stroke="#aa6324" stroke-width="2"/><text x="360.0" y="307" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#aa6324" text-anchor="middle">1.20 m overall</text><line x1="589" y1="340" x2="589" y2="700" stroke="#aa6324" stroke-width="2"/><line x1="582" y1="340" x2="596" y2="340" stroke="#aa6324" stroke-width="2"/><line x1="582" y1="700" x2="596" y2="700" stroke="#aa6324" stroke-width="2"/><text x="604" y="520.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">1.20 m</text><text x="90" y="797" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#606b70" text-anchor="start">TOP PLAN / floor feet A–D</text><rect x="260" y="815" width="120" height="160" rx="0" fill="#f4f0e5" stroke="#78878b" stroke-width="4"/><rect x="265" y="822.5" width="10" height="10" rx="0" fill="#aa6324" stroke="#28343a" stroke-width="2"/><text x="282" y="834.5" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#aa6324" text-anchor="start">A</text><rect x="365" y="822.5" width="10" height="10" rx="0" fill="#aa6324" stroke="#28343a" stroke-width="2"/><text x="345" y="834.5" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#aa6324" text-anchor="start">B</text><rect x="265" y="957.5" width="10" height="10" rx="0" fill="#aa6324" stroke="#28343a" stroke-width="2"/><text x="282" y="969.5" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#aa6324" text-anchor="start">C</text><rect x="365" y="957.5" width="10" height="10" rx="0" fill="#aa6324" stroke="#28343a" stroke-width="2"/><text x="345" y="969.5" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#aa6324" text-anchor="start">D</text><text x="430" y="865" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">W 1.20 × L 1.60 m</text><text x="430" y="901" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#28343a" text-anchor="start">Cab/front is at top</text><text x="430" y="935" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#28343a" text-anchor="start">Same floor feet A–D</text><text x="1020" y="271" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: outer W 1.20 × L 1.60 m</text><text x="1020" y="302" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: H 1.20 m above bed floor</text><text x="1020" y="333" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: total top = 1.92 m</text><text x="1020" y="364" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: nominal frame members 0.04 m</text><text x="1020" y="395" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: shared A/B/C/D floor mounts</text><text x="1020" y="455" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#28343a" text-anchor="start">READABLE AT CHASE DISTANCE</text><text x="1020" y="497" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Two hoops, broad flat paint,</text><text x="1020" y="528" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">few chunky connection plates.</text><text x="1020" y="559" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No tiny bolt texture requirement.</text><text x="1020" y="590" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Cream/ochre steel; muted dark trim.</text><text x="1020" y="621" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No copied badge or real branding.</text><text x="1020" y="680" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#28343a" text-anchor="start">MVP RULES</text><text x="1020" y="723" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Only one equipped fitting.</text><text x="1020" y="754" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Do not add over-cab arms or cargo</text><text x="1020" y="785" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">overhang to make the drawing fit.</text><text x="1020" y="816" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No capacity or stat bonus is set here.</text><text x="1020" y="847" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Mass, cargo volume, legal load and</text><text x="1020" y="878" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">bracket fit remain U.</text><text x="1020" y="926" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">U: rear access, drop-side operation,</text><text x="1020" y="957" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">loaded envelope and real service fit.</text></svg>