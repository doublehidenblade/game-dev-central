 height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="1034" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">MVP EQUIPMENT AND STORAGE</text><rect x="158" y="299" width="530" height="636" rx="0" fill="#f4f0e5" stroke="#28343a" stroke-width="5"/><line x1="158" y1="505.70000000000005" x2="158" y2="728.3" stroke="#f4f0e5" stroke-width="9"/><line x1="149" y1="505.70000000000005" x2="149" y2="728.3" stroke="#aa6324" stroke-width="5"/><rect x="211" y="532.2" width="344.5" height="169.60000000000002" rx="0" fill="#f1dec1" stroke="#28343a" stroke-width="2"/><text x="383.25" y="623.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#28343a" text-anchor="middle">PARK / UNLOAD</text><rect x="184.5" y="866.1" width="159" height="42.400000000000006" rx="0" fill="#78878b" stroke="#28343a" stroke-width="2"/><text x="264.0" y="893.3000000000001" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="600" fill="#28343a" text-anchor="middle">BENCH</text><rect x="555.5" y="802.5" width="106" height="106" rx="0" fill="#d9e9e8" stroke="#28343a" stroke-width="2"/><text x="608.5" y="861.5" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#28343a" text-anchor="middle">SUPPLIES</text><rect x="555.5" y="325.5" width="106" height="106" rx="0" fill="#d9e9e8" stroke="#28343a" stroke-width="2"/><text x="608.5" y="384.5" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#28343a" text-anchor="middle">MODULE</text><rect x="184.5" y="325.5" width="159" height="79.5" rx="0" fill="#fffdf8" stroke="#28343a" stroke-width="2"/><text x="264.0" y="371.25" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="600" fill="#28343a" text-anchor="middle">RIG RESERVE</text><rect x="264" y="564" width="238.5" height="106" rx="0" fill="#fffdf8" stroke="#28343a" stroke-width="2"/><text x="383.25" y="623.0" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="600" fill="#28343a" text-anchor="middle">CLEARANCE BUDGET</text><text x="160" y="275" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#606b70" text-anchor="start">Rear/deeper interior →</text><text x="98" y="600" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#aa6324" text-anchor="start">IN</text><line x1="95" y1="623" x2="158" y2="623" stroke="#aa6324" stroke-width="4"/><line x1="158" y1="969" x2="688" y2="969" stroke="#aa6324" stroke-width="2"/><line x1="158" y1="962" x2="158" y2="976" stroke="#aa6324" stroke-width="2"/><line x1="688" y1="962" x2="688" y2="976" stroke="#aa6324" stroke-width="2"/><text x="423.0" y="956" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#aa6324" text-anchor="middle">10.00 m room depth</text><line x1="723" y1="299" x2="723" y2="935" stroke="#aa6324" stroke-width="2"/><line x1="716" y1="299" x2="730" y2="299" stroke="#aa6324" stroke-width="2"/><line x1="716" y1="935" x2="730" y2="935" stroke="#aa6324" stroke-width="2"/><text x="738" y="617.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">12.00 m</text><text x="60" y="991" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#606b70" text-anchor="start">1.90 m between park rectangle and the supply/module reservations (D-derived)</text><text x="1036" y="273" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: bench footprint 3.00 × 0.80 m</text><text x="1036" y="304" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: bench height 0.90 m</text><text x="1036" y="335" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: shelf asset 1.60 × 0.60 × 1.90 m</text><text x="1036" y="366" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: supply zone 2.00 × 2.00 m</text><text x="1036" y="397" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: stored-module zone 2.00 × 2.00 m</text><text x="1036" y="465" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">One unequipped fitting at a time</text><text x="1036" y="496" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">fits the proposed 1.20 × 1.60 m</text><text x="1036" y="527" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">bounding box with 0.40 / 0.20 m</text><text x="1036" y="558" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">gross centered floor margins.</text><text x="1036" y="589" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">D: fixed-slot swap / presentation cut.</text><text x="1036" y="660" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#9b4440" text-anchor="start">12 UNITS: UNPROVEN CAPACITY</text><text x="1036" y="701" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">The brief requests an initial 12-unit</text><text x="1036" y="732" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">shelf. Actual pack sizes are U.</text><text x="1036" y="763" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Do not turn this empty reservation</text><text x="1036" y="794" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">into a measured capacity claim.</text><text x="1036" y="825" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No 24-unit or second-bay capacity.</text><text x="1036" y="892" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">U: real pack packing, access aisle,</text><text x="1036" y="923" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">service-view readability, moving</text><text x="1036" y="954" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">parts and obstruction clearance.</text></svg>