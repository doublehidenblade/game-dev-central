ejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Body L 3.40 m / W 1.50 m / H 1.85 m</text><text x="858" y="298" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Mirror envelope W 1.72 m (chosen budget)</text><text x="858" y="329" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Bed clear W 1.30 m × L 1.70 m</text><text x="858" y="360" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Bed-floor height 0.72 m above design ground</text><text x="858" y="423" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">D: one shared bed-local coordinate frame</text><text x="858" y="463" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">Origin: center of usable bed floor</text><text x="858" y="494" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">Axes: +X left, +Y up, +Z cab/front</text><text x="858" y="525" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">A (+0.500, 0, +0.675) m  front-left</text><text x="858" y="556" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">B (−0.500, 0, +0.675) m  front-right</text><text x="858" y="587" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">C (+0.500, 0, −0.675) m  rear-left</text><text x="858" y="618" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D (−0.500, 0, −0.675) m  rear-right</text><text x="858" y="675" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">D: 0.10 × 0.10 m footplate allowance</text><text x="858" y="706" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">Socket centers are 0.15 m from bed sides</text><text x="858" y="737" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">and 0.175 m from each bed end.</text><text x="858" y="768" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">Both modules contact the bed FLOOR.</text><text x="858" y="799" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">Drop-side rail tops are not supports.</text><text x="858" y="853" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#9b4440" text-anchor="start">U: actual root transform, brackets, fasteners,</text><text x="858" y="884" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#9b4440" text-anchor="start">wheel/light envelopes, collider and payload.</text><text x="858" y="915" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#9b4440" text-anchor="start">No-build targets and formulas: interfaces.json</text><text x="858" y="946" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#9b4440" text-anchor="start">Owner must measure the selected 3D blockout.</text><text x="858" y="979" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#9b4440" text-anchor="start">The four floor mounts are a new option, not recovered r3 coordinates.</text></svg>