"487" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="500" fill="#fffdf8" text-anchor="middle">OCCLUDED BY DOOR</text><text x="1260" y="551" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="500" fill="#9b4440" text-anchor="middle">Shelter only after all checks</text><rect x="48" y="596" width="714" height="410" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="72" y="635" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">D: CLEARANCE TARGETS</text><rect x="788" y="596" width="764" height="410" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="812" y="635" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">M / U: WHAT THIS DOES NOT PROVE</text><text x="76" y="680" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Opening 4.20 W × 3.20 H m</text><text x="76" y="711" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Curtain collision allowance 0.22 m deep</text><text x="76" y="742" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">Complete vehicle + fitting + cargo budget:</text><text x="76" y="773" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">2.00 W × 4.50 L × 2.20 H m</text><text x="76" y="804" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">D-derived square-entry margin: 1.10 m / side</text><text x="76" y="835" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">D-derived height margin: 1.00 m</text><text x="76" y="866" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#aa6324" text-anchor="start">D: full-inside margin 0.20 m; mechanism 0.45 m</text><text x="816" y="680" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">M: current coupe has a 2.00 × 4.50 m plan union.</text><text x="816" y="711" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">M: low-speed measured-pose sweep = 10.1477 m.</text><text x="816" y="742" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">A 10 m-deep room is not a proven U-turn space.</text><text x="816" y="773" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">M: lot 4472 still has a solid collision wall.</text><text x="816" y="804" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">U: loaded future-truck sweep and transient entry.</text><text x="816" y="835" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">U: closure detection against the chosen margin,</text><text x="816" y="866" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#28343a" text-anchor="start">police sight/occlusion, fast drive-past and reload.</text><text x="816" y="945" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#9b4440" text-anchor="start">These illustrations specify intended states, not implemented behavior.</text></svg>