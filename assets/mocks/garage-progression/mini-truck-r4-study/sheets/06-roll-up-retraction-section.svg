<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f4f0e5" stroke="#f4f0e5" stroke-width="0"/><text x="48" y="50" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#606b70" text-anchor="start">GARAGE MVP / INTERFACE PROPOSAL</text><text x="48" y="99" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#28343a" text-anchor="start">Roll-up curtain / retraction section</text><text x="48" y="138" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#606b70" text-anchor="start">D: a stylized flexible curtain winds inside a fixed casing; no full-height rigid leaf travels above the opening</text><rect x="1260" y="30" width="292" height="48" rx="6" fill="#f1dec1" stroke="#aa6324" stroke-width="1.5"/><text x="1406" y="61" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#aa6324" text-anchor="middle">DRAFT - NOT ACCEPTED</text><line x1="48" y1="158" x2="1552" y2="158" stroke="#bfc5c1" stroke-width="2"/><text x="48" y="1060" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#606b70" text-anchor="start">D = chosen design target   |   M = measured current-game fact   |   U = unresolved</text><text x="48" y="1090" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#606b70" text-anchor="start">2D schematic only. Not recovered r3 art, CAD, an engine capture or a runtime acceptance.</text><text x="1546" y="1085" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="500" fill="#606b70" text-anchor="end">06 / 06</text><rect x="48" y="184" width="860" height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="72" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">SIDE SECTION / +d INSIDE / ALL SHUTTER GEOMETRY D</text><rect x="934" y="184" width="618" height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="958" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">SIMPLE GAME-ASSET MOTION CONTRACT</text><line x1="112" y1="925.0" x2="842" y2="925.0" stroke="#28343a" stroke-width="4"/><text x="114" y="954.0" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#606b70" text-anchor="start">FLOOR h = 0</text><line x1="112" y1="280.0" x2="842" y2="280.0" stroke="#236675" stroke-width="3" stroke-dasharray="9 6"/><text x="114" y="265.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#236675" text-anchor="start">M: nominal soffit h = 4.30 m</text><rect id="shutter-casing-section" data-px-per-m="150" x="342.5" y="377.5" width="75.0" height="67.49999999999996" rx="0" fill="#f1dec1" stroke="#aa6324" stroke-width="3"/><circle id="shutter-roll-section" data-px-per-m="150" cx="380.0" cy="411.25" r="30.0" fill="#78878b" stroke="#28343a" stroke-width="2"/><circle cx="380.0" cy="411.25" r="16.5" fill="#f1dec1" stroke="#28343a" stroke-width="1"/><rect id="shutter-free-curtain-section" data-px-per-m="150" x="348.5" y="445.0" width="33.0" height="480.0" rx="0" fill="none" stroke="#aa6324" stroke-width="2" stroke-dasharray="8 6"/><line x1="365.0" y1="925.0" x2="365.0" y2="445.0" stroke="#78878b" stroke-width="5"/><line x1="411.5" y1="925.0" x2="411.5" y2="595.0" stroke="#9b4440" stroke-width="3" stroke-dasharray="8 6"/><line x1="411.5" y1="760.0" x2="695.0" y2="760.0" stroke="#9b4440" stroke-width="3"/><text x="437.0" y="744.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#9b4440" text-anchor="start">Full vehicle/load stays deeper →</text><text x="443" y="527.5" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#aa6324" text-anchor="start">D: nearest union point d ≥ +0.31 m</text><text x="443" y="562.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#606b70" text-anchor="start">0.20 m behind inner face d = +0.11</text><line x1="197" y1="445.0" x2="197" y2="925.0" stroke="#aa6324" stroke-width="2"/><line x1="190" y1="445.0" x2="204" y2="445.0" stroke="#aa6324" stroke-width="2"/><line x1="190" y1="925.0" x2="204" y2="925.0" stroke="#aa6324" stroke-width="2"/><text x="212" y="685.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">3.20 m</text><line x1="770" y1="377.5" x2="770" y2="445.0" stroke="#aa6324" stroke-width="2"/><line x1="763" y1="377.5" x2="777" y2="377.5" stroke="#aa6324" stroke-width="2"/><line x1="763" y1="445.0" x2="777" y2="445.0" stroke="#aa6324" stroke-width="2"/><text x="785" y="411.25" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">0.45 m</text><line x1="417.5" y1="377.5" x2="765" y2="377.5" stroke="#aa6324" stroke-width="1"/><line x1="417.5" y1="445.0" x2="765" y2="445.0" stroke="#aa6324" stroke-width="1"/><line x1="342.5" y1="351.5" x2="417.5" y2="351.5" stroke="#aa6324" stroke-width="2"/><line x1="342.5" y1="344.5" x2="342.5" y2="358.5" stroke="#aa6324" stroke-width="2"/><line x1="417.5" y1="344.5" x2="417.5" y2="358.5" stroke="#aa6324" stroke-width="2"/><text x="380.0" y="338.5" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#aa6324" text-anchor="middle">0.50 m depth</text><text x="443" y="314.5" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#236675" text-anchor="start">0.65 m nominal remainder before roof/lights</text><text x="448" y="416.5" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#aa6324" text-anchor="start">0.40 m roll diameter</text><text x="112" y="978" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#606b70" text-anchor="start">Dashed curtain box: CLOSED extent. OPEN: no curtain below h = 3.20 m.</text><text x="960" y="270" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: casing W 4.40 × D 0.50 × H 0.45 m</text><text x="960" y="301" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: opening W 4.20 × H 3.20 m</text><text x="960" y="332" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: roll diameter 0.40 m / width 4.20 m</text><text x="960" y="363" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: curtain guard thickness 0.22 m</text><text x="960" y="439" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#28343a" text-anchor="start">CLOSED / MOVING</text><text x="960" y="480" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Visual lower edge, collision and sight</text><text x="960" y="511" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">occlusion follow the same unrolled extent.</text><text x="960" y="542" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">The roll/casing is a simple stylized asset.</text><text x="960" y="573" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No individual slat or spring simulation.</text><text x="960" y="644" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#28343a" text-anchor="start">FULLY OPEN</text><text x="960" y="685" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No free-curtain collision or occluder</text><text x="960" y="716" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">remains below the 3.20 m clear opening.</text><text x="960" y="747" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">The roll is contained inside the casing.</text><text x="960" y="778" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Static casing collision stays overhead.</text><text x="960" y="885" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">U: actual roof/light fit, obstruction logic,</text><text x="960" y="916" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">crossing checks and police integration.</text><text x="960" y="947" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">This section specifies geometry, not tests.</text></svg>