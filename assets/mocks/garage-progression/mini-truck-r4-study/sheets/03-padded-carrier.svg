<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f4f0e5" stroke="#f4f0e5" stroke-width="0"/><text x="48" y="50" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#606b70" text-anchor="start">GARAGE MVP / INTERFACE PROPOSAL</text><text x="48" y="99" font-family="DejaVu Sans,sans-serif" font-size="38" font-weight="700" fill="#28343a" text-anchor="start">Padded carrier / distinct low silhouette</text><text x="48" y="138" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#606b70" text-anchor="start">One floor-mounted cassette, using the same four mounts as the rack; no second chassis or socket grid</text><rect x="1260" y="30" width="292" height="48" rx="6" fill="#f1dec1" stroke="#aa6324" stroke-width="1.5"/><text x="1406" y="61" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#aa6324" text-anchor="middle">DRAFT - NOT ACCEPTED</text><line x1="48" y1="158" x2="1552" y2="158" stroke="#bfc5c1" stroke-width="2"/><text x="48" y="1060" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#606b70" text-anchor="start">D = chosen design target   |   M = measured current-game fact   |   U = unresolved</text><text x="48" y="1090" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#606b70" text-anchor="start">2D schematic only. Not recovered r3 art, CAD, an engine capture or a runtime acceptance.</text><text x="1546" y="1085" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="500" fill="#606b70" text-anchor="end">03 / 06</text><rect x="48" y="184" width="920" height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="72" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">D: TOP PLAN AND REAR ELEVATION</text><rect x="994" y="184" width="558" height="822" rx="12" fill="#fffdf8" stroke="#bfc5c1" stroke-width="1.5"/><text x="1018" y="223" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#28343a" text-anchor="start">FIT AND CAPABILITY CONTRACT</text><text x="98" y="253" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#606b70" text-anchor="start">TOP PLAN / CAB AT TOP</text><rect id="padded-top-outer" data-px-per-m="300" x="222.0" y="310.0" width="360.0" height="480.0" rx="0" fill="#78878b" stroke="#28343a" stroke-width="3"/><rect x="240.0" y="328.0" width="324.0" height="444.0" rx="0" fill="#f1dec1" stroke="#28343a" stroke-width="2"/><rect x="222.0" y="310.0" width="360.0" height="18.0" rx="0" fill="#819188" stroke="#28343a" stroke-width="2"/><rect x="222.0" y="310.0" width="18.0" height="480.0" rx="0" fill="#819188" stroke="#28343a" stroke-width="2"/><rect x="564.0" y="310.0" width="18.0" height="480.0" rx="0" fill="#819188" stroke="#28343a" stroke-width="2"/><rect x="222.0" y="772.0" width="360.0" height="18.0" rx="0" fill="#819188" stroke="#28343a" stroke-width="2"/><text x="402.0" y="536" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#28343a" text-anchor="middle">PADDED WELL</text><text x="402.0" y="574" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#aa6324" text-anchor="middle">1.08 × 1.48 m</text><circle id="padded-mount-bed_A" cx="252.0" cy="347.5" r="8" fill="#aa6324" stroke="#28343a" stroke-width="2"/><circle id="padded-mount-bed_B" cx="552.0" cy="347.5" r="8" fill="#aa6324" stroke="#28343a" stroke-width="2"/><circle id="padded-mount-bed_C" cx="252.0" cy="752.5" r="8" fill="#aa6324" stroke="#28343a" stroke-width="2"/><circle id="padded-mount-bed_D" cx="552.0" cy="752.5" r="8" fill="#aa6324" stroke="#28343a" stroke-width="2"/><line x1="222.0" y1="297" x2="582.0" y2="297" stroke="#aa6324" stroke-width="2"/><line x1="222.0" y1="290" x2="222.0" y2="304" stroke="#aa6324" stroke-width="2"/><line x1="582.0" y1="290" x2="582.0" y2="304" stroke="#aa6324" stroke-width="2"/><text x="402.0" y="284" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="500" fill="#aa6324" text-anchor="middle">1.20 m overall</text><line x1="635" y1="310.0" x2="635" y2="790.0" stroke="#aa6324" stroke-width="2"/><line x1="628" y1="310.0" x2="642" y2="310.0" stroke="#aa6324" stroke-width="2"/><line x1="628" y1="790.0" x2="642" y2="790.0" stroke="#aa6324" stroke-width="2"/><text x="650" y="550.0" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">1.60 m</text><text x="100" y="824" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#606b70" text-anchor="start">REAR ELEVATION</text><rect id="padded-rear-body" data-px-per-m="300" x="222.0" y="841" width="360.0" height="135.0" rx="0" fill="#819188" stroke="#28343a" stroke-width="3"/><rect id="padded-rear-base" data-px-per-m="300" x="222.0" y="966" width="360.0" height="10" rx="0" fill="#78878b" stroke="#28343a" stroke-width="2"/><text x="635" y="922" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">H = 0.45 m</text><text x="635" y="958" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">Top = 1.17 m</text><text x="1020" y="270" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: outer W 1.20 × L 1.60 m</text><text x="1020" y="301" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: H 0.45 m above bed floor</text><text x="1020" y="332" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: total top = 1.17 m</text><text x="1020" y="363" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: edge allowance incl. pad 0.06 m</text><text x="1020" y="394" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#aa6324" text-anchor="start">D: base allowance incl. pad 0.06 m</text><text x="1020" y="460" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: clear inside W 1.08 × L 1.48 m</text><text x="1020" y="491" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">D: depth above pad = 0.39 m</text><text x="1020" y="522" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">These are geometry targets only.</text><text x="1020" y="553" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">They do not establish cargo units</text><text x="1020" y="584" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#aa6324" text-anchor="start">or a protection modifier.</text><text x="1020" y="655" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#28343a" text-anchor="start">DISTINCT FROM THE RACK</text><text x="1020" y="696" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Low olive/canvas pads, broad seams,</text><text x="1020" y="727" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">dark straps and a simple steel base.</text><text x="1020" y="758" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">No refrigeration, springs or free-</text><text x="1020" y="789" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">swinging cargo simulation implied.</text><text x="1020" y="820" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#28343a" text-anchor="start">Visible soft sides versus open rack.</text><text x="1020" y="883" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">U: rear access/lip detail, mass, cargo</text><text x="1020" y="914" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">shape compatibility, protection value</text><text x="1020" y="945" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#9b4440" text-anchor="start">and actual loading animation.</text></svg>